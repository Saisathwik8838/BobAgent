[project]
name = "bobagent-backend"
version = "0.1.0"
description = "BobAgent - AI Career Intelligence & Job Application Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.1",
    "pgvector>=0.3.5",
    "redis>=5.1.0",
    "rq>=1.16.2",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
