name: Deploy BobAgent to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'Dockerfile.*'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure Region'
        required: true
        default: 'eastus'
      resource_group:
        description: 'Resource Group Name'
        required: true
        default: 'rg-bobagent-prod'

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ github.event.inputs.resource_group || 'rg-bobagent-prod' }}
  AZURE_LOCATION: ${{ github.event.inputs.location || 'eastus' }}
  APP_NAME: bobagent

jobs:
  deploy-to-azure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or Verify Azure Resource Group
        run: |
          echo "Ensuring resource group ${{ env.AZURE_RESOURCE_GROUP }} exists in ${{ env.AZURE_LOCATION }}..."
          az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }}

      - name: Deploy Infrastructure via Azure Bicep
        id: bicep_deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/azure/main.bicep
          parameters: ./infra/azure/parameters.json
          failOnStdErr: false

      - name: Retrieve Bicep Deployment Outputs
        id: get_outputs
        run: |
          ACR_SERVER="${{ steps.bicep_deploy.outputs.acrLoginServer }}"
          ACR_NAME="${{ steps.bicep_deploy.outputs.acrName }}"
          FRONTEND_URL="${{ steps.bicep_deploy.outputs.frontendUrl }}"
          BACKEND_URL="${{ steps.bicep_deploy.outputs.backendUrl }}"
          
          echo "ACR_SERVER=$ACR_SERVER" >> $GITHUB_ENV
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          
          echo "Target Container Registry: $ACR_SERVER"
          echo "Frontend Live URL: $FRONTEND_URL"
          echo "Backend Live URL: $BACKEND_URL"

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/bobagent-backend:latest
            ${{ env.ACR_SERVER }}/bobagent-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/bobagent-frontend:latest
            ${{ env.ACR_SERVER }}/bobagent-frontend:${{ github.sha }}

      - name: Update Container Apps with Latest Images
        run: |
          echo "Updating backend container app revision..."
          az containerapp update \
            --name ${{ env.APP_NAME }}-backend \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/bobagent-backend:${{ github.sha }}

          echo "Updating frontend container app revision..."
          az containerapp update \
            --name ${{ env.APP_NAME }}-frontend \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/bobagent-frontend:${{ github.sha }}

      - name: Deployment Success Summary
        run: |
          echo "========================================================="
          echo "🚀 BobAgent Deployed Successfully to Azure Container Apps!"
          echo "Frontend URL: ${{ env.FRONTEND_URL }}"
          echo "Backend URL:  ${{ env.BACKEND_URL }}"
          echo "API Docs:     ${{ env.BACKEND_URL }}/docs"
          echo "Health Check: ${{ env.BACKEND_URL }}/api/v1/health"
          echo "========================================================="
